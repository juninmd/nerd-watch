name: SAST

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

# Dois pushes próximos em `main` não precisam rodar o SAST do commit antigo:
# o novo já varre o mesmo histórico. `cancel-in-progress` evita empilhar runner.
concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast:
    uses: juninmd/base-actions/.github/workflows/reusable-sast.yml@main
    with:
      # Relatorio no primeiro ciclo; aperte para true depois do triage.
      fail-semgrep: false
