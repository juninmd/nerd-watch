name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Mesma faixa do ambiente de desenvolvimento; ajuste aqui se subir de major.
          bun-version: '1.3.13'

      # `node-datachannel` tem postinstall nativo e está em `trustedDependencies`, então o binário
      # pré-compilado é baixado aqui — é o que faz `import webtorrent` funcionar no runner.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      # lint + typecheck + testes. É o mesmo comando que roda local (`bun run check`).
      - name: Checagens
        run: bun run check

      # O typecheck não cobre o bundle do cliente; um import quebrado só aparece aqui.
      - name: Compilar o cliente
        run: bun run build:client

      - name: Smoke test das rotas principais
        run: bun run smoke
