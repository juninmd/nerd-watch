name: Release

# Release automático a partir de commit convencional (docs/adr/0004-auto-update-tauri.md):
# o push em `main` calcula a próxima versão, cria a tag `vX.Y.Z` e publica o instalador assinado.
# O app instalado lê `releases/latest/download/latest.json` no boot e se atualiza sozinho.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de versão (auto = pelos commits convencionais)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.next.outputs.changed }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: next
        run: bun run scripts/next-version.ts --bump "${{ inputs.bump || 'auto' }}"

  # Sem `validate` aqui de propósito: o commit que chega em `main` já passou pelo
  # workflow Validate (check obrigatório no PR) e o Validate roda de novo no push
  # em `main`. Revalidar dentro do Release só somava ~25s antes do build.
  release:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: cache do bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: dependências
        run: bun install --frozen-lockfile
      - name: cliente
        run: bun run build:client
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: sidecar do servidor
        run: bun run build:server
      - name: aplica a versão calculada
        run: bun run scripts/next-version.ts --apply --bump "${{ inputs.bump || 'auto' }}"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: nerd-watch v__VERSION__
          releaseBody: |
            Instalador do nerd-watch v__VERSION__ (Windows x64, NSIS).

            O app instalado se atualiza sozinho: ele checa `releases/latest/download/latest.json`
            no boot e aplica a versão assinada. Quem prefere manual baixa o `-setup.exe` abaixo.
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          tauriScript: bun tauri
          args: --bundles nsis
