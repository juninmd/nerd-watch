<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nerd-watch</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b12;
        --fg: #f4f4f8;
        --muted: #8b8ba7;
        --accent: #ff3d6e;
        --accent-2: #ffb03d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 0%, #1a1a2b, var(--bg) 60%);
        color: var(--fg);
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      main {
        text-align: center;
        padding: 32px;
        max-width: 520px;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid;
        place-items: center;
        font-size: 34px;
        box-shadow: 0 18px 48px -18px var(--accent);
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .bar {
        margin: 26px auto 0;
        width: 220px;
        height: 4px;
        border-radius: 99px;
        overflow: hidden;
        background: #23233a;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(360%);
        }
      }
      #error {
        margin-top: 22px;
        color: #ffb4c4;
        font-size: 13.5px;
        white-space: pre-wrap;
        display: none;
      }
      body[data-failed] .bar {
        display: none;
      }
      body[data-failed] #error {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">🍿</div>
      <h1>nerd-watch</h1>
      <p id="status">subindo o servidor local…</p>
      <div class="bar"><span></span></div>
      <p id="error"></p>
    </main>
    <script>
      // O shell em Rust chama esta função quando o servidor não sobe.
      window.nerdWatchError = (message) => {
        document.body.dataset.failed = 'true';
        document.getElementById('status').textContent = 'não foi possível abrir o nerd-watch';
        document.getElementById('error').textContent = message;
      };
    </script>
  </body>
</html>
